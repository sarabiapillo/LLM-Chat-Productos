version: '3.8'

services:
  # 1. Servicio de la Aplicación Laravel SaaS
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_chat_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: llm_chat
      DB_USERNAME: llm_user
      DB_PASSWORD: Elfos10@@@@@@
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/smart-filter
    volumes:
      - .:/var/www/llm-chat
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - n8n
    networks:
      - llm_network

  # 2. Base de Datos MySQL 8.0
  db:
    image: mysql:8.0
    container_name: llm_chat_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: llm_chat
      MYSQL_USER: llm_user
      MYSQL_PASSWORD: Elfos10@@@@@@
      MYSQL_ROOT_PASSWORD: Elfos10@@@@@@
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - llm_network

  # 3. Motor de Automatización e IA n8n en Docker
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: llm_chat_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Mexico_City
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - llm_network

  # 4. Redis Cache y Queues
  redis:
    image: redis:alpine
    container_name: llm_chat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - llm_network

networks:
  llm_network:
    driver: bridge

volumes:
  db_data:
  n8n_data:
